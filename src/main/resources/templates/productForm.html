
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
</head>
<body>

<h1>Add Product</h1>

<nav>
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/categories}">Categories</a>
    <a th:href="@{/brands}">Brands</a>
</nav>

<form th:action="@{/products}" th:object="${product}" method="post">

    <label>SKU:</label>
    <input type="text" th:field="*{sku}">
    <span th:errors="*{sku}"></span>
    <br>

    <label>Name:</label>
    <input type="text" th:field="*{name}">
    <span th:errors="*{name}"></span>
    <br>

    <label>Category:</label>
    <select th:field="*{category}">
        <option value="">Select Category</option>
        <option th:each="category : ${categories}"
                th:value="${category.slug}"
                th:text="${category.name}">
        </option>
    </select>
    <span th:errors="*{category}"></span>
    <br>

    <label>Brand:</label>
    <select th:field="*{brandSlug}">
        <option value="">No brand</option>
        <option th:each="brand : ${brands}"
                th:value="${brand.slug}"
                th:text="${brand.name}">
        </option>
    </select>
    <br>

    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{price}">
    <span th:errors="*{price}"></span>
    <br>

    <label>Stock:</label>
    <input type="number" th:field="*{stockQuantity}">
    <span th:errors="*{stockQuantity}"></span>
    <br>

    <button type="submit">Save Product</button>

</form>

<a th:href="@{/products}">Back to products</a>

</body>
</html>
